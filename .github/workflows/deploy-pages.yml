name: Deploy Trust Identifier Trace Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build site directory
        run: |
          set -e
          mkdir -p _site
          
          # Copy all HTML files to site root
          cp *.html _site/ 2>/dev/null || true
          
          # Copy data and archive directories
          cp -r output _site/ 2>/dev/null || true
          cp -r archive _site/ 2>/dev/null || true
          cp -r overlays _site/ 2>/dev/null || true
          cp -r identifiers.json _site/ 2>/dev/null || true
          
          # Create default index.html if missing
          if [ ! -f _site/index.html ]; then
            cat > _site/index.html << 'EOFHTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Trust Identifier Trace</title>
              <style>
                  body { font-family: Arial, sans-serif; background: #111; color: #eee; padding: 20px; }
                  h1 { color: #0ff; }
                  .container { max-width: 800px; margin: 0 auto; }
                  .nav { margin: 20px 0; }
                  .nav a { display: inline-block; margin-right: 20px; padding: 10px 15px; 
                          background: #333; color: #0ff; text-decoration: none; border-radius: 5px; }
                  .nav a:hover { background: #555; }
                  .info { background: #222; padding: 15px; margin: 10px 0; border-radius: 5px; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>🔍 Trust Identifier Trace</h1>
                  <p>Advanced trust identifier scanning and analysis system</p>
                  
                  <div class="nav">
                      <a href="dashboard.html">Trust Dashboard</a>
                      <a href="syndicate_dashboard.html">Syndicate Dashboard</a>
                      <a href="output/scan_results.json">Latest Scan Results</a>
                      <a href="output/">Output Directory</a>
                      <a href="archive/">Archived Results</a>
                      <a href="overlays/">Overlay Files</a>
                  </div>
                  
                  <div class="info">
                      <h2>📊 System Components</h2>
                      <ul>
                          <li><strong>Trust Scan Bot:</strong> Automated identifier scanning with Reddit analysis</li>
                          <li><strong>GLEIF Integration:</strong> Legal entity identifier verification</li>
                          <li><strong>Overlay System:</strong> Hash-verified overlay file management</li>
                          <li><strong>Archive System:</strong> Timestamped scan result preservation</li>
                          <li><strong>Dashboard Interface:</strong> Interactive data visualization</li>
                      </ul>
                  </div>
                  
                  <div class="info">
                      <h2>🚀 Features</h2>
                      <ul>
                          <li>Real-time trust identifier monitoring</li>
                          <li>Multi-source data aggregation (GLEIF, Reddit, custom sources)</li>
                          <li>Automated GitHub Actions workflows</li>
                          <li>Comprehensive dashboard analytics</li>
                          <li>Cryptographic overlay verification</li>
                      </ul>
                  </div>
              </div>
          </body>
          </html>
          EOFHTML
          fi
          
          echo "✓ Site build complete"
          ls -lh _site/ | head -20

      - name: Log site structure for audit
        run: |
          echo "=== DEPLOYMENT AUDIT LOG ===" > deploy-audit.txt
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> deploy-audit.txt
          echo "Commit: ${{ github.sha }}" >> deploy-audit.txt
          echo "Branch: ${{ github.ref }}" >> deploy-audit.txt
          echo "" >> deploy-audit.txt
          echo "Files deployed to _site/:" >> deploy-audit.txt
          find _site -type f -exec ls -lh {} \; >> deploy-audit.txt
          echo "" >> deploy-audit.txt
          echo "Directory tree:" >> deploy-audit.txt
          tree _site -L 3 >> deploy-audit.txt 2>/dev/null || find _site -type d | sort >> deploy-audit.txt
          cat deploy-audit.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 30

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Log deployment success
        run: |
          echo "✓ Deployed to: ${{ steps.deployment.outputs.page_url }}"
          echo "  Deployment timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "  Commit: ${{ github.sha }}"
