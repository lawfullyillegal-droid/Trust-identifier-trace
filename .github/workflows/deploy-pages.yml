name: Deploy Trust Identifier Trace Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - name: Publish only reviewed public pages and sanitized index
        run: |
          set -eu
          mkdir -p _site/public_records
          cp index.html incrimination_nation.html _site/
          cp public_records/records.json _site/public_records/records.json
          # Deliberately never publish output/, archive/, overlays/, identifiers.json,
          # legal-documents/, case exhibits, or other repository contents.
      - uses: actions/upload-pages-artifact@v3
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
