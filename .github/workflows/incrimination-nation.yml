name: Incrimination Nation - Public Record Scraper

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  public-record-scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Create output directory
        run: mkdir -p public_records

      - name: Scrape public records
        run: |
          python scrape_public_records.py

      - name: Sync investigation ledger summary
        run: |
          python3 investigation_bot.py --summary
          python3 investigation_bot.py --timeline
          echo "🔍 Escalated events:"
          python3 -c "
          import json
          with open('investigations/events.json') as f:
              events = json.load(f)
          escalated = [e for e in events if e.get('status') == 'escalated']
          for e in escalated:
              print(f\"  [{e['event_date'][:10]}] {e['event_type']} — {e['defendant']}\")
          print(f'Total escalated: {len(escalated)}/{len(events)}')
          "

      - name: Configure Git
        run: |
          git config user.name "PublicRecordBot"
          git config user.email "bot@lawfully-illegal.com"

      - name: Commit public records
        run: |
          TIMESTAMP=$(date -u +'%Y-%m-%d_%H-%M-%S')
          git add public_records/ scrape_public_records.py
          if git diff --cached --quiet; then
            echo "✅ No changes to commit."
          else
            git commit -m "📜 Incrimination Nation: Record snapshot ${TIMESTAMP} - Automated public record scrape committed to immutable Git history. Website: https://www.lawfully-illegal.com/public-ledge - This record cannot be destroyed - it is part of Git history."
            git push || echo "Push skipped due to branch protection rules"
      - name: Record completion
        run: |
          echo "✅ Public record scrape complete and committed to Git history"
