name: Incrimination Nation - Evidence Integrity Checks

on:
  push:
    paths:
      - 'scripts/incrimination_nation.py'
      - 'tests/test_incrimination_nation.py'
      - 'public_records/**'
      - '.github/workflows/incrimination-nation.yml'
  pull_request:
    paths:
      - 'scripts/incrimination_nation.py'
      - 'tests/test_incrimination_nation.py'
      - 'public_records/**'
      - '.github/workflows/incrimination-nation.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  validate-public-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test provenance and public-data rules
        run: python -m unittest discover -s tests -v
      - name: Rebuild public index and check committed data
        run: |
          python scripts/incrimination_nation.py --input public_records/intake.json --output /tmp/incrimination_records.json
          diff -u public_records/records.json /tmp/incrimination_records.json
      - name: Assert no legacy fabricated sample
        run: |
          if grep -q 'sample_data' public_records/records.json; then
            echo 'Fabricated sample record must not be published'
            exit 1
          fi
