name: Syndicate Output Generator

"on":
  workflow_run:
    workflows: ["Trust Scan Bot", "Reddit Trace Bot"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-syndicate-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Create output directory
        run: mkdir -p output

      - name: Generate syndicate dashboard
        run: python generate_syndicate_dashboard.py

      - name: Configure Git
        run: |
          git config user.name "TrustBot"
          git config user.email "trustbot@travisryle.org"

      - name: Commit syndicate dashboard data
        run: |
          git add output/syndicate_dashboard_data.json
          if git diff --cached --quiet; then
            echo "✅ No changes to commit."
          else
            git commit -m "Update syndicate dashboard data - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push || echo "Push skipped due to branch protection rules"
          fi
